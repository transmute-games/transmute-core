name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        check: [docs, engine, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: flox/install-flox-action@5bb9eaaffbeaa699a8251a1ae21ecf4c8e0e37d4 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-${{ matrix.check }}-${{ hashFiles('bun.lock', '.flox/env/manifest.lock', '**/*.gradle', '**/gradle-wrapper.properties') }}
      - name: Install locked dependencies
        run: flox activate -- bun install --frozen-lockfile
      - name: Install browser
        if: matrix.check != 'engine'
        run: flox activate -- bunx playwright install --with-deps chromium
      - name: Verify
        run: flox activate -- bash scripts/check.sh ${{ matrix.check }}
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ matrix.check }}
          path: |
            packages/java/*/build/reports/
            examples/java/*/build/reports/
            eval/fixtures/*/build/reports/
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - name: Upload website
        if: matrix.check == 'web'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website
          path: website/out/
