name: CI

on:
  push:
    branches: [master, main, 'feat/**']
  pull_request:

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Test engine
        run: ./gradlew :transmute-core:test
      - name: Publish to Maven Local
        run: ./gradlew :transmute-core:publishToMavenLocal
      - name: Verify hello example headless
        run: |
          cd examples/hello
          ./gradlew test verifyHeadless
      - name: Verify platformer playtest
        run: |
          cd examples/platformer
          ./gradlew test verifyHeadless
      - name: Verify rpg playtest
        run: |
          cd examples/rpg
          ./gradlew test verifyHeadless

  cli:
    name: CLI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Build CLI
        run: ./gradlew :transmute-cli:build
