name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        check: [docs, java, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: flox/install-flox-action@5bb9eaaffbeaa699a8251a1ae21ecf4c8e0e37d4 # v2
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-${{ matrix.check }}-${{ hashFiles('bun.lock', '.flox/env/manifest.lock', '**/*.gradle', '**/gradle-wrapper.properties') }}
      - name: Install locked dependencies
        run: flox activate -- bun install --frozen-lockfile
      - name: Install browser
        if: matrix.check != 'java'
        run: flox activate -- bunx playwright install --with-deps chromium
      - name: Verify
        run: flox activate -- bash scripts/check.sh ${{ matrix.check }}
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports-${{ matrix.check }}
          path: |
            packages/*/build/reports/
            examples/*/build/reports/
            eval/fixtures/*/build/reports/
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - name: Upload website
        if: matrix.check == 'web'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: website
          path: website/out/
