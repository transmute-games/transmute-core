name: Release CLI
on:
  push:
    tags: ['cli-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing cli-vX.Y.Z tag to release
        required: true
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Resolve release tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^cli-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git checkout --detach "refs/tags/$RELEASE_TAG"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#cli-v}" >> "$GITHUB_OUTPUT"
      - uses: flox/install-flox-action@5bb9eaaffbeaa699a8251a1ae21ecf4c8e0e37d4 # v2
      - name: Build and test release
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          flox activate -- ./gradlew :transmute-cli:test :transmute-cli:fatJar -PreleaseVersion="$RELEASE_VERSION"
          flox activate -- java -jar "packages/java/transmute-cli/build/libs/transmute-cli-$RELEASE_VERSION-all.jar" version | grep -F "Transmute CLI v$RELEASE_VERSION"
      - name: Package assets
        run: |
          mkdir release-assets
          cp packages/java/transmute-cli/build/libs/transmute-cli-*-all.jar release-assets/transmute-cli.jar
          cp packages/java/transmute-cli/bin/transmute packages/java/transmute-cli/bin/transmute.bat LICENSE release-assets/
          cd release-assets
          sha256sum ./* > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "Transmute CLI $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
