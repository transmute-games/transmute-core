plugins {
    id 'application'
    id 'java'
}

group = 'games.example'
version = '1.0.0'

repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation 'games.transmute:transmute-core:1.0.0'
    testImplementation 'junit:junit:4.13.2'
}

application {
    mainClass = 'games.example.hello.HelloGame'
}

run {
    workingDir = projectDir
}

tasks.register('verifyHeadless', JavaExec) {
    group = 'verification'
    description = 'Runs HelloGame --headless and asserts a frame'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'games.example.hello.HelloGame'
    args = ['--headless']
    workingDir = projectDir
}

check.dependsOn verifyHeadless
