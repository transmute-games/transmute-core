{
  "lockfile-version": 1,
  "manifest": {
    "schema-version": "1.18.0",
    "install": {
      "actionlint": {
        "pkg-path": "actionlint"
      },
      "bun": {
        "pkg-path": "bun",
        "version": "1.3.11"
      },
      "jdk17": {
        "pkg-path": "jdk17"
      },
      "nodejs_22": {
        "pkg-path": "nodejs_22"
      },
      "shellcheck": {
        "pkg-path": "shellcheck"
      }
    },
    "vars": {
      "NEXT_TELEMETRY_DISABLED": "1",
      "PUPPETEER_SKIP_DOWNLOAD": "true"
    },
    "hook": {
      "on-activate": "  export PLAYWRIGHT_BROWSERS_PATH=\"$FLOX_ENV_PROJECT/.cache/ms-playwright\"\n  export JAVA_HOME\n  JAVA_HOME=\"$(java -XshowSettings:properties -version 2>&1 | sed -n 's/^ *java.home = //p')\"\n  if [ -z \"${CI:-}\" ]; then\n    git -C \"$FLOX_ENV_PROJECT\" config core.hooksPath .githooks\n  fi\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "x86_64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    },
    "services": {
      "website": {
        "command": "bun run --cwd website dev"
      }
    }
  },
