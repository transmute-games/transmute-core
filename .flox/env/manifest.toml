schema-version = "1.18.0"

[install]
jdk17.pkg-path = "jdk17"
bun.pkg-path = "bun"
bun.version = "1.3.11"
nodejs_22.pkg-path = "nodejs_22"
actionlint.pkg-path = "actionlint"
shellcheck.pkg-path = "shellcheck"

[vars]
PUPPETEER_SKIP_DOWNLOAD = "true"
NEXT_TELEMETRY_DISABLED = "1"

[hook]
on-activate = '''
  export PLAYWRIGHT_BROWSERS_PATH="$FLOX_ENV_PROJECT/.cache/ms-playwright"
  export JAVA_HOME
  JAVA_HOME="$(java -XshowSettings:properties -version 2>&1 | sed -n 's/^ *java.home = //p')"
  if [ -z "${CI:-}" ]; then
    git -C "$FLOX_ENV_PROJECT" config core.hooksPath .githooks
  fi
'''

[services.website]
command = "bun run --cwd website dev"

[options]
systems = ["aarch64-darwin", "x86_64-darwin", "aarch64-linux", "x86_64-linux"]
